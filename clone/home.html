<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Third Home</title>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
      :root {
        /* colour scheme.png */
        --sunshine: #FFD167;
        --long-days: #ADCFD0;
        --captain: #4360B0;
        --buttered-corn: #FDE4AE;
        --sea: #5EABC9;
        --tomato: #EF6646;

        --bg: #FFFCF6;
        --surface: #FFFFFF;
        --surface-up: #FFF7E8;
        --border: #EBE1CC;
        --border-hi: #DCCFAF;
        --ink: #3A4550;
        --muted: #8A8577;
        --text-strong: #232830;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        height: 100%;
        width: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: "IBM Plex Mono", system-ui, sans-serif;
      }

      .home {
        min-height: 100dvh;
        width: 100%;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(60% 50% at 50% 0%, #fff0cf 0%, transparent 70%),
          var(--bg);
      }

      /* top third: title + subtitle placeholder */
      .hero {
        flex: 1 1 33vh;
        min-height: 220px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        text-align: center;
        padding: 32px 24px 16px;
      }

      .hero-title {
        font-family: Georgia, serif;
        font-weight: 700;
        color: var(--captain);
        font-size: clamp(40px, 7vw, 84px);
        letter-spacing: .02em;
        margin: 0;
        line-height: 1.05;
      }

      .hero-subtitle {
        margin-top: 18px;
        min-height: 1.6em;
        font-size: 12px;
        font-weight: 300;
        letter-spacing: .18em;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* bottom two-thirds: character cards */
      .cards {
        flex: 2 1 67vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: clamp(12px, 2vw, 28px);
        padding: 16px clamp(16px, 4vw, 56px) clamp(24px, 5vh, 56px);
        flex-wrap: wrap;
      }

      .card {
        --card-bg: var(--surface);
        --card-accent: var(--captain);
        --card-on-accent: #fff;
        flex: 1 1 0;
        min-width: 150px;
        max-width: 230px;
        aspect-ratio: 3 / 4;
        perspective: 1400px;
        transition: transform .2s ease, aspect-ratio .35s ease;
      }

      .card:hover {
        transform: translateY(-4px);
      }

      .card.open {
        flex: 1 1 300px;
        min-width: 260px;
        max-width: 320px;
        aspect-ratio: 3 / 4.25;
      }

      /* the piece that actually swivels */
      .card-flip {
        position: relative;
        width: 100%;
        height: 100%;
        cursor: pointer;
        transform-style: preserve-3d;
        transition: transform .7s cubic-bezier(.4, .15, .2, 1);
      }

      .card.open .card-flip {
        transform: rotateY(180deg);
      }

      .card-face {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 18px;
        text-align: center;
        background: var(--card-bg);
        border: 1px solid rgba(0, 0, 0, .08);
        border-radius: 14px;
        box-shadow: 0 1px 3px rgba(58, 69, 80, .08);
        backface-visibility: hidden;
        -webkit-backface-visibility: hidden;
        transition: box-shadow .2s ease;
      }

      .card:hover .card-face {
        box-shadow: 0 10px 26px rgba(58, 69, 80, .2);
      }

      .card-face.card-back {
        transform: rotateY(180deg);
        justify-content: flex-start;
        gap: 10px;
        padding: 16px;
      }

      .card-avatar {
        width: 56px;
        height: 56px;
        border-radius: 50%;
        background: var(--card-accent);
        display: flex;
        align-items: center;
        justify-content: center;
        color: var(--card-on-accent);
        font-family: Georgia, serif;
        font-size: 20px;
        font-weight: 700;
        transition: transform .2s ease;
        flex-shrink: 0;
      }

      .card:hover .card-avatar {
        transform: scale(1.06);
      }

      .card-name {
        font-size: 12px;
        font-weight: 700;
        letter-spacing: .08em;
        text-transform: uppercase;
        color: var(--card-accent);
      }

      .card-back-name {
        font-family: Georgia, serif;
        font-size: 15px;
        font-weight: 700;
        letter-spacing: .01em;
        text-transform: uppercase;
        color: var(--card-accent);
      }

      .card-back-desc {
        font-size: 10.5px;
        font-weight: 400;
        line-height: 1.45;
        color: #1e1e1e;
        white-space: pre-line;
      }

      .card-back-activities {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }

      .card-back-activities-label {
        font-size: 9px;
        font-weight: 700;
        letter-spacing: .1em;
        text-transform: uppercase;
        color: var(--card-accent);
      }

      .activity-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 4px;
      }

      .activity-pill {
        padding: 4px 8px;
        border-radius: 12px;
        background: var(--card-accent);
        color: var(--card-on-accent);
        font-size: 8px;
        font-weight: 700;
        letter-spacing: .05em;
        text-transform: uppercase;
        white-space: nowrap;
      }

      .card-back-footer {
        margin-top: auto;
        padding-top: 6px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
        flex-shrink: 0;
      }

      .begin-btn {
        display: inline-block;
        padding: 7px 20px;
        border-radius: 20px;
        background: #1e1e1e;
        border: 1px solid #1e1e1e;
        color: #fff;
        font-family: "IBM Plex Mono", system-ui, sans-serif;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: .07em;
        text-transform: uppercase;
        text-decoration: none;
        cursor: pointer;
        transition: box-shadow .15s ease, transform .15s ease;
      }

      .begin-btn:hover {
        box-shadow: 0 6px 18px rgba(0, 0, 0, .35);
      }

      .begin-btn:active {
        transform: scale(.96);
      }

      .card-back-hint {
        font-size: 9px;
        font-weight: 600;
        letter-spacing: .12em;
        text-transform: uppercase;
        color: #1e1e1e;
        opacity: .55;
      }

      @media (max-width: 720px) {
        .cards {
          flex-wrap: wrap;
        }
        .card {
          flex: 1 1 40%;
          max-width: none;
          aspect-ratio: 4 / 3;
        }
        .card.open {
          flex: 1 1 100%;
          max-width: none;
          min-width: 0;
          aspect-ratio: 3 / 4.4;
        }
      }
    </style>
  </head>
  <body>
    <div class="home">
      <section class="hero">
        <h1 class="hero-title">Third Home</h1>
        <p class="hero-subtitle" id="subtitle"></p>
      </section>

      <section class="cards" id="cards"></section>
    </div>

    <script>
      // from "personas descriptions.pdf"
      const PERSONAS = [
        {
          title: "The Newcomer",
          bg: "#ADCFD0",     // long days
          accent: "#4360B0", // captain
          onAccent: "#fff",
          desc: "Welcome to Wolfsburg, the city with the iconic Volkswagen Factory!\n\nAre you here for the weekend? Exploring the city? Perhaps feeling a bit lost and not sure where to stay? Don't worry, you've come to the right place!\n\nThird Home is the perfect spot for Newcomers such as you :) Stay here for days, weeks or even months! We also have all kinds of social events for you to take part in, are you interested?",
          activities: ["Open Studios", "Playrooms", "Workshops", "Cafe / Bar"],
        },
        {
          title: "Artist-Curator",
          bg: "#EF6646",     // ripe tomatoes
          accent: "#FDE4AE", // buttered corn
          onAccent: "#3A2A12",
          desc: "A new talent in town! Welcome to Wolfsburg :)\n\nLooking for a space to showcase your art? Third Home is not just a place for living but also a space for people like you who are looking for co-working or exhibition and workshop spaces.\n\nWhat's a better way to meet new people and, possibly, new fans of your work? Host events and find the right crowd to display your pieces! Be the light that shines Third Home <3",
          activities: ["Co-Working", "Performance", "Workshops", "Exhibition"],
        },
        {
          title: "The Retiree",
          bg: "#FFD167",     // pure sunshine
          accent: "#EF6646", // ripe tomatoes
          onAccent: "#fff",
          desc: "How's it going, Legend? What are your plans for today?\n\nHave you heard of this place, Third Home? I suddenly have this urge to play chess with you, finally see who's the better player. What do you say? Ready to lose, old man?\n\nThey have more than Playrooms, you know. They have a very impressive gnome collection in their gardens, which I'm sure you'd love to see. We could also grab a beeeeeer!",
          activities: ["Retreat", "Playrooms", "Gardening", "Cafe / Bar"],
        },
        {
          title: "The Urban Wanderer",
          bg: "#4360B0",     // captain
          accent: "#FFD167", // pure sunshine
          onAccent: "#3A2A12",
          desc: "Where did you go this weekend? City hopping can be fun, but what about Wolfsburg itself? You have to explore the city you live in!\n\nAre you free next weekend, though? Let's mix it up. Third Home has so many events going on this month. There's an exhibition on mass printing and they are screening “2001: A Space Odyssey”. They also have a yoga studio on Thursday evenings. Or we could go there right now and take our work with us. They have a great cafe too :)",
          activities: ["Open Studios", "Co-Working", "Terraces", "Exhibition"],
        },
        {
          title: "Volkswagen Worker",
          bg: "#FDE4AE",     // buttered corn
          accent: "#5EABC9", // sea
          onAccent: "#fff",
          desc: "You look like you need a breather :/ that bad, huh? Well, not to fret. Even though you work odd shift times at the Volkswagen factory, there is a place for you to unwind :)\n\nThird Home is open 24/7. It includes quiet lounging spaces, private terraces and beautiful gardens. But if you still have the energy, there are always events taking place, even at this hour! Do you know Salsa? Or what if we booked a space to have a karaoke night! The fun is endless.",
          activities: ["Performance", "Terraces", "Gardening", "Retreat"],
        },
      ];

      const cardsEl = document.getElementById("cards");

      PERSONAS.forEach((persona) => {
        const initial = persona.title.replace("The ", "").charAt(0);
        const activityPills = persona.activities
          .map((a) => `<div class="activity-pill">${a}</div>`)
          .join("");

        const card = document.createElement("div");
        card.className = "card";
        card.style.setProperty("--card-bg", persona.bg);
        card.style.setProperty("--card-accent", persona.accent);
        card.style.setProperty("--card-on-accent", persona.onAccent);
        card.innerHTML = `
          <div class="card-flip" role="button" tabindex="0" aria-expanded="false" aria-label="${persona.title}">
            <div class="card-face card-front">
              <div class="card-avatar">${initial}</div>
              <div class="card-name">${persona.title}</div>
            </div>
            <div class="card-face card-back">
              <div class="card-back-name">${persona.title}</div>
              <div class="card-back-desc">${persona.desc}</div>
              <div class="card-back-activities">
                <div class="card-back-activities-label">Suggested Activities</div>
                <div class="activity-grid">${activityPills}</div>
              </div>
              <div class="card-back-footer">
                <a class="begin-btn" href="index.html">Let's Begin!</a>
                <div class="card-back-hint">Tap card to close</div>
              </div>
            </div>
          </div>
        `;
        cardsEl.appendChild(card);

        const flip = card.querySelector(".card-flip");
        const beginBtn = card.querySelector(".begin-btn");
        const toggle = () => {
          const isOpen = card.classList.toggle("open");
          flip.setAttribute("aria-expanded", String(isOpen));
          if (isOpen) {
            window.setTimeout(() => {
              card.scrollIntoView({ behavior: "smooth", block: "nearest" });
            }, 360);
          }
        };
        flip.addEventListener("click", toggle);
        flip.addEventListener("keydown", (e) => {
          if (e.key === "Enter" || e.key === " ") {
            e.preventDefault();
            toggle();
          }
        });
        beginBtn.addEventListener("click", (e) => e.stopPropagation());
        beginBtn.addEventListener("keydown", (e) => e.stopPropagation());
      });
    </script>
  </body>
</html>
