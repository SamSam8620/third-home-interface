name: Deploy to GitHub Pages

on:
  push:
    branches: [website/home-page]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Assemble site
        run: |
          mkdir dist
          cp -r clone/. dist/
          mv dist/index.html dist/viewer.html
          cp dist/home.html dist/index.html
          sed -i 's/href="index.html"/href="viewer.html"/' dist/index.html
          rm -f dist/serve.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
